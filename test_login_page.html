<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            display: block;
        }
        .result.error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
            display: block;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Тестирование входа</h1>
    <form id="testLoginForm">
        <div class="form-group">
            <label for="username">Логин:</label>
            <input type="text" id="username" value="test" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" value="test123" required>
        </div>

        <button type="submit">Тестировать вход</button>
    </form>

    <div id="result" class="result"></div>

    <script>
        document.getElementById('testLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            console.log('Отправка запроса входа:', { username, password });

            try {
                const response = await fetch('http://localhost:3002/api/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                console.log('Статус ответа:', response.status);
                const data = await response.json();
                console.log('Данные ответа:', data);

                if (response.ok && data.token) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✓ Вход успешен!</h3>
                        <p>Роль: ${data.role}</p>
                        <p>Токен:</p>
                        <pre>${data.token}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>✗ Ошибка входа</h3>
                        <p>${data.error || 'Неизвестная ошибка'}</p>
                        <p>Статус: ${response.status}</p>
                    `;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>✗ Ошибка подключения</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
